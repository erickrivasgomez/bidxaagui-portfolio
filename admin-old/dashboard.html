<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel · BIDXAAGUI</title>
  <meta name="description" value="Panel administrativo de BIDXAAGUI" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body {
      padding-top: 0;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Merienda", Georgia, serif;
      display: flex;
      flex-direction: column;
    }

    header.dashboard-header {
      background: var(--bg-alt);
      color: var(--text-light);
      padding: 24px;
    }

    .dashboard-header .brand-mark {
      color: var(--text-light);
    }

    .dashboard-header h1 {
      margin: 12px 0 0;
      color: var(--text-light);
      font-size: 1.8rem;
    }

    main.dashboard-main {
      flex: 1;
      width: min(1100px, 92%);
      margin: -40px auto 40px;
    }

    .dashboard-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .dashboard-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .dashboard-controls button {
      border: none;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(184, 92, 60, 0.04);
    }

    .stat-card span {
      display: block;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-card strong {
      font-size: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 16px;
      overflow: hidden;
    }

    thead {
      background: var(--bg-alt);
      color: var(--text-light);
    }

    th,
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(every-odd) {
      background: rgba(0, 0, 0, 0.02);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    #status-msg {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header class="dashboard-header">
    <div class="container">
      <div class="brand-mark" aria-label="BIDXAAGUI">
        <img src="../assets/images/downloads/logo-transparente.png" alt="BIDXAAGUI logo" style="width:48px;height:48px;border-radius:12px;object-fit:cover;">
        <span>BIDXAAGUI · Panel</span>
      </div>
      <h1>Suscriptores del boletín</h1>
    </div>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-card">
      <div class="dashboard-controls">
        <p id="status-msg">Cargando datos…</p>
        <button id="logout-btn" class="btn btn-primary">Cerrar sesión</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total suscriptores</span>
          <strong id="total-count">0</strong>
        </div>
        <div class="stat-card">
          <span>Recientes (24h)</span>
          <strong id="recent-count">0</strong>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Fecha de alta</th>
            </tr>
          </thead>
          <tbody id="subscriber-body">
            <tr>
              <td colspan="3">Sin datos aún.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="dashboard.js" type="module"></script>
</body>

</html>
